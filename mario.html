<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mario Jawi Tahun 2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b1f3b;--card:#2a2f5a;--ac:#ffd23f}
html,body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#w{max-width:860px;margin:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
#hud{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
#hud span{background:var(--card);padding:4px 9px;border-radius:12px}
#q{background:var(--ac);color:#222;border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;text-align:center}
#box{position:relative}
canvas{width:100%;display:block;border-radius:12px;background:#5c94fc}
.ov{position:absolute;inset:0;background:rgba(15,18,45,.94);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;overflow:auto}
.ov h1{margin:0;font-size:24px;color:var(--ac)}
.ov p{margin:0;font-size:15px}
input{font-size:18px;padding:10px;border-radius:10px;border:0;text-align:center;width:70%;max-width:260px}
.b{background:var(--ac);color:#222;border:0;border-radius:12px;padding:11px 22px;font-size:17px;font-weight:800}
.wa{background:#25d366;color:#fff}
#qo{display:flex;flex-direction:column;gap:8px;width:80%;max-width:320px}
.ar{font-family:"Noto Naskh Arabic","Traditional Arabic","Amiri",serif;font-size:30px;line-height:1.3;padding:4px}
.ok{background:#2ecc40!important;color:#fff}.no{background:#e74c3c!important;color:#fff}
#ct{display:flex;gap:8px}
#ct button{flex:1;font-size:24px;padding:14px 0;border:0;border-radius:14px;background:var(--card);color:#fff}
#ct button:active{background:#44498a}
#bj{flex:1.6!important;font-size:16px!important;font-weight:800}
.hide{display:none!important}
</style></head><body><div id="w">
<div id="hud"><span id="hn">👤 -</span><span id="hl">❤️❤️❤️</span><span id="hv">Level 1</span><span id="hs">⭐ 0</span><span id="hp">0/15</span></div>
<div id="q">Tekan Mula!</div>
<div id="box"><canvas id="c" width="800" height="400"></canvas>
<div class="ov" id="st"><h1>🍄 Mario Jawi 🍄</h1><p>Jawi Tahun 2 • 15 soalan<br>Langgar kotak ❓ dari bawah untuk membaca soalan.<br>Pijak atau tembak 🔥 musuh untuk markah tambahan.</p>
<input id="nm" maxlength="14" placeholder="Taip nama anda"><button class="b" id="go">▶ MULA</button></div>
<div class="ov hide" id="qd"><div id="qe" style="font-size:40px"></div><p id="qt"></p><small id="qa"></small><div id="qo"></div></div>
<div class="ov hide" id="en"><h1 id="et"></h1><p id="ep"></p><button class="b wa" id="sh">📲 Kongsi ke WhatsApp</button><button class="b" id="re">🔁 Main Semula</button></div></div>
<div id="ct"><button id="bl">◀</button><button id="br">▶</button><button id="bs">🔥</button><button id="bj">⤒ LOMPAT</button></div>
</div>
<script>
const Q=[
["🐱","Ejaan Jawi bagi 'kucing'?","كوچيڠ","كاسيڠ","كريس"],
["☁️","Ejaan Jawi bagi 'langit'?","لاڠيت","كوچيڠ","ڤينتو"],
["🧦","Ejaan Jawi bagi 'stoking'?","ستوكيڠ","ساويت","كاسيڠ"],
["🌀","Ejaan Jawi bagi 'gasing'?","ڬاسيڠ","لاڠيت","ستوكيڠ"],
["🚪","Ejaan Jawi bagi 'pintu'?","ڤينتو","ڤينسيل","ماسين"],
["🌴","Ejaan Jawi bagi 'sawit'?","ساويت","ويب","موڽيت"],
["🐒","Ejaan Jawi bagi 'monyet'?","موڽيت","كوڽيت","ساويت"],
["🟠","Ejaan Jawi bagi 'kunyit'?","كوڽيت","موڽيت","كوچيڠ"],
["🐘","Ejaan Jawi bagi 'gading'?","ڬاديڠ","ڤيريڠ","كاسيڠ"],
["🍵","Ejaan Jawi bagi 'teh' (e taling)?","تيه","بيڠ","ديڠ"],
["📖","Perkataan 'lis' menggunakan vokal?","Vokal i","Vokal e taling","Vokal a"],
["📖","Perkataan 'gel' menggunakan vokal?","Vokal e taling","Vokal i","Vokal u"],
["✍️","Vokal 'e' taling ditulis dengan huruf?","ي","ا","و"],
["✍️","Vokal 'e' pepet tiada huruf. Ejaan 'tempah'?","تمڤه","تيمڤيه","تيمڤه"],
["🥷","Ejaan Jawi bagi 'ninja'?","نينجا","مينتول","كينچو"]];
const AR=/[\u0600-\u06FF\u0750-\u077F]/,$=i=>document.getElementById(i);
const c=$('c'),x=c.getContext('2d'),W=800,H=400,G=340,WORLD=7000;
let S='start',name='',score=0,lives=3,lvl=1,qi=0,ans=0,ok=0,P,E=[],B=[],F=[],PT=[],K={},inv=0,dead=0,cd=0,lock=0,msg='',mt=0,fr=0,cam=0,cur,AC;
const rnd=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);
/* bunyi */
function tn(a,d=.08,ty='square',v=.07){if(!AC)return;a.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*d;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)})}
const SN={jump:()=>tn([330,520],.06),shoot:()=>tn([900,500,250],.04,'sawtooth'),stomp:()=>tn([220,120],.07),box:()=>tn([260,330],.07),
good:()=>tn([523,659,784,1047,1319],.09),bad:()=>tn([200,150,110],.14,'sawtooth'),die:()=>tn([400,300,200,100],.13,'triangle'),win:()=>tn([523,523,523,659,784,659,784,1047],.13),hit:()=>tn([500,300],.05,'sawtooth')};
function hud(){$('hn').textContent='👤 '+name;$('hl').textContent='❤️'.repeat(Math.max(lives,0))||'💀';$('hv').textContent='Level '+lvl;$('hs').textContent='⭐ '+score;$('hp').textContent=ans+'/15';$('q').textContent='❓ Langgar kotak ❓ untuk baca soalan ('+ans+'/15)'}
function addE(px){E.push({x:px,y:-40,ox:px,w:30,h:30,vx:-(.8+lvl*.15),vy:0})}
function build(){B=[];E=[];for(let i=0;i<15;i++){const bx=650+i*420;B.push({x:bx,y:205,w:46,h:46,used:0,bump:0});addE(bx+210);if(i%2)addE(bx+260)}}
function start(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
name=$('nm').value.trim()||'Pemain';score=0;lives=3;lvl=1;qi=0;ans=0;ok=0;inv=0;F=[];PT=[];cam=0;lock=0;
P={x:60,y:G-38,w:28,h:38,vx:0,vy:0,on:1,f:1};build();$('st').classList.add('hide');$('en').classList.add('hide');$('qd').classList.add('hide');S='play';hud()}
function end(win){S='end';win?SN.win():SN.die();const st=ok>=13?'⭐⭐⭐':ok>=9?'⭐⭐':ok>=5?'⭐':'';
$('et').textContent=win?'🎉 Misi Tamat!':'💀 Nyawa Habis!';
$('ep').innerHTML=res().replace(/\n/g,'<br>');$('en').classList.remove('hide')}
function res(){const p=ok>=13?'Hebat 🌟':ok>=10?'Bagus 😍':ok>=6?'Boleh tahan 👍':'Cuba lagi 💪';return '🍄 Mario Jawi Tahun 2 🍄\nNama : '+name+'\nMarkah : '+score+'\nBetul : '+ok+'/15\n'+p}
function die(){lives--;S='dying';dead=75;P.vy=-11;SN.die();hud()}
function burst(px,py,col,n=14){for(let i=0;i<n;i++)PT.push({x:px,y:py,vx:(Math.random()-.5)*8,vy:-Math.random()*8,l:40,c:col})}
/* soalan */
function openQ(){const q=Q[qi];cur={a:q[2],o:rnd(q.slice(2))};lock=0;S='quiz';
$('qe').textContent=q[0];$('qt').textContent=q[1];$('qa').textContent='Soalan '+(qi+1)+'/15 • Aras '+(qi<5?'Mudah':qi<10?'Sederhana':'Sukar');
const o=$('qo');o.innerHTML='';cur.o.forEach((t,i)=>{const b=document.createElement('button');b.className='b'+(AR.test(t)?' ar':'');b.textContent=t;b.onclick=()=>pick(i);o.appendChild(b)});$('qd').classList.remove('hide')}
function pick(i){if(lock)return;lock=1;const bs=$('qo').children,right=cur.o[i]===cur.a;
bs[i].classList.add(right?'ok':'no');if(!right)for(let k=0;k<3;k++)if(cur.o[k]===cur.a)bs[k].classList.add('ok');
if(right){score+=100;ok++;lvl++;E.forEach(e=>e.vx*=1.1);msg='✅ BETUL! LEVEL UP!';SN.good();burst(P.x+14,P.y,'#ffd23f',24)}
else{score=Math.max(0,score-50);for(let k=0;k<3;k++)addE(P.x+260+k*70);msg='❌ SALAH! Musuh datang!';SN.bad()}
mt=110;qi++;ans++;hud();
setTimeout(()=>{$('qd').classList.add('hide');if(ans>=15)end(true);else S='play'},1200)}
/* kemas kini */
function up(){fr++;PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--});PT=PT.filter(p=>p.l>0);if(mt>0)mt--;B.forEach(b=>{if(b.bump>0)b.bump--});
if(S=='dying'){P.vy+=.6;P.y+=P.vy;if(--dead<=0){if(lives<=0)return end(false);P.y=G-P.h;P.vy=0;inv=150;E=E.filter(e=>Math.abs(e.x-P.x)>260);S='play'}return}
if(S!='play')return;
P.vx=((K.r?1:0)-(K.l?1:0))*4.4;if(P.vx)P.f=P.vx>0?1:-1;
if(K.j&&P.on){P.vy=-13.8;P.on=0;SN.jump()}
if(cd>0)cd--;if(K.s&&cd<=0){cd=18;F.push({x:P.f>0?P.x+P.w:P.x-8,y:P.y+16,vx:P.f*9,l:70});SN.shoot()}
P.x=Math.max(cam,Math.min(WORLD-P.w,P.x+P.vx));P.vy+=.65;P.y+=P.vy;
if(P.y+P.h>=G){P.y=G-P.h;P.vy=0;P.on=1}else P.on=0;
cam=Math.max(0,Math.min(WORLD-W,P.x-320));
if(P.vy<0)for(const b of B){if(!b.used&&P.x+P.w>b.x&&P.x<b.x+b.w&&P.y<b.y+b.h&&P.y-P.vy>=b.y+b.h-3){P.y=b.y+b.h;P.vy=1.5;b.used=1;b.bump=8;SN.box();burst(b.x+23,b.y,'#ffd23f',8);openQ();return}}
F.forEach(f=>{f.x+=f.vx;f.l--;for(let i=E.length-1;i>=0;i--){const e=E[i];if(f.x>e.x&&f.x<e.x+e.w&&f.y>e.y&&f.y<e.y+e.h){E.splice(i,1);f.l=0;score+=25;burst(e.x+15,e.y+15,'#ff7a00');SN.stomp();msg='+25 Tembak!';mt=40;hud();break}}});
F=F.filter(f=>f.l>0&&f.x>cam-20&&f.x<cam+W+20);
for(let i=E.length-1;i>=0;i--){const e=E[i];e.x+=e.vx;if(Math.abs(e.x-e.ox)>140)e.vx*=-1;if(e.x<0){e.x=0;e.vx=Math.abs(e.vx)}
e.vy+=.5;e.y+=e.vy;if(e.y+e.h>=G){e.y=G-e.h;e.vy=0}
if(P.x+P.w>e.x+4&&P.x<e.x+e.w-4&&P.y+P.h>e.y&&P.y<e.y+e.h){
if(P.vy>0&&P.y+P.h-P.vy<=e.y+14){E.splice(i,1);P.vy=-9;score+=50;burst(e.x+15,e.y+20,'#8b4a1e');SN.stomp();msg='+50 Pijak!';mt=40;hud()}
else if(inv<=0){die();return}}}
if(inv>0)inv--}
/* lukis */
function dp(){if(!P||(inv>0&&fr%8<4&&S=='play'))return;
x.save();x.translate(P.x+14,P.y);x.scale(P.f,1);x.translate(-14,0);
x.fillStyle='#e52521';x.fillRect(2,0,24,8);x.fillRect(14,6,14,4);
x.fillStyle='#f5c08a';x.fillRect(4,10,20,10);x.fillStyle='#222';x.fillRect(18,12,3,4);x.fillRect(10,17,12,2);
x.fillStyle='#e52521';x.fillRect(2,20,24,8);x.fillStyle='#2b4bd8';x.fillRect(5,24,18,8);
const w=P.on&&P.vx?(fr%10<5?3:-3):0;x.fillRect(5+w,32,8,6);x.fillRect(15-w,32,8,6);
x.fillStyle='#5a3216';x.fillRect(3+w,36,10,3);x.fillRect(15-w,36,10,3);x.restore()}
function de(e){x.fillStyle='#8b4a1e';x.beginPath();x.ellipse(e.x+15,e.y+13,15,13,0,0,7);x.fill();
x.fillStyle='#fff';x.fillRect(e.x+7,e.y+8,6,7);x.fillRect(e.x+18,e.y+8,6,7);x.fillStyle='#000';x.fillRect(e.x+10,e.y+10,3,4);x.fillRect(e.x+18,e.y+10,3,4);
x.fillStyle='#3a1c08';x.fillRect(e.x+2,e.y+24,10,6);x.fillRect(e.x+18,e.y+24,10,6)}
function dr(){const g=x.createLinearGradient(0,0,0,G);g.addColorStop(0,'#4a86f0');g.addColorStop(1,'#a8d4ff');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#fff';for(let k=-1;k<4;k++){const a=k*350-(cam*.3%350)+100,b=50+(k&1)*40;x.beginPath();x.arc(a,b,22,0,7);x.arc(a+26,b+4,18,0,7);x.arc(a-26,b+6,16,0,7);x.fill()}
x.fillStyle='#4fae4f';for(let k=-1;k<4;k++){const a=k*300-(cam*.5%300)+150;x.beginPath();x.ellipse(a,G,130,90,0,Math.PI,0);x.fill()}
x.save();x.translate(-cam,0);
x.fillStyle='#3cb043';x.fillRect(cam,G,W,14);x.fillStyle='#b5651d';x.fillRect(cam,G+14,W,H);x.fillStyle='#9a5516';for(let i=Math.floor(cam/40)*40;i<cam+W+40;i+=40)x.fillRect(i,G+24,2,40);
x.fillStyle='#ddd';x.fillRect(WORLD-120,G-170,6,170);x.fillStyle='#2ecc40';x.fillRect(WORLD-114,G-170,44,28);
x.textAlign='center';x.textBaseline='middle';
B.forEach(b=>{const y=b.y-(b.bump>4?(8-b.bump)*3:b.bump*3);x.fillStyle=b.used?'#8a6a3a':'#f5a623';x.fillRect(b.x,y,b.w,b.h);x.strokeStyle='#6b3d00';x.lineWidth=3;x.strokeRect(b.x,y,b.w,b.h);
if(!b.used){x.fillStyle='#fff';x.font='800 32px sans-serif';x.fillText('?',b.x+b.w/2,y+b.h/2+2)}});
E.forEach(de);F.forEach(f=>{x.fillStyle='#ff7a00';x.beginPath();x.arc(f.x,f.y,6,0,7);x.fill();x.fillStyle='#ffe066';x.beginPath();x.arc(f.x,f.y,3,0,7);x.fill()});
if(S!='end')dp();PT.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5)});x.restore();
if(mt>0){x.fillStyle='rgba(0,0,0,.7)';x.font='800 26px sans-serif';x.textAlign='center';x.fillText(msg,W/2,100)}}
function loop(){try{up();dr()}catch(e){console.error(e)}requestAnimationFrame(loop)}loop();
/* kawalan */
const kb={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',' ':'j',a:'l',d:'r',w:'j',x:'s',z:'s',f:'s'};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(kb[e.key]){K[kb[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(kb[e.key])K[kb[e.key]]=0});
[['bl','l'],['br','r'],['bs','s'],['bj','j']].forEach(([i,k])=>{const b=$(i);b.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>K[k]=0));b.addEventListener('contextmenu',e=>e.preventDefault())});
$('go').onclick=start;$('re').onclick=start;
$('sh').onclick=()=>{const t=res();window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
</script></body></html>
